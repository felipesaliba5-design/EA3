<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBot - Chat Webhook n8n</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 3rem);
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Cabeçalho de Configuração */
    .chat-header {
      background-color: #111827;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .bot-info h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .bot-info p {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Barra de URL do Webhook */
    .webhook-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    .webhook-bar label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #818cf8;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .webhook-bar input {
      flex: 1;
      min-width: 280px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .quick-urls {
      display: flex;
      gap: 0.35rem;
    }

    .btn-chip {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-chip:hover {
      background: #6366f1;
      color: #fff;
    }

    /* Área de Mensagens */
    .messages-area {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #0f172a;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .bubble {
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: #6366f1;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.bot .bubble {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 2px;
    }

    .time {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 0.25rem;
      padding: 0 0.3rem;
    }

    .message.user .time {
      align-self: flex-end;
    }

    /* Indicador de Digitação */
    .typing {
      display: none;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .typing span {
      width: 6px;
      height: 6px;
      background-color: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* Barra de Envio */
    .input-bar {
      padding: 1rem;
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 0.75rem;
    }

    .input-bar input {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-bar input:focus {
      border-color: #6366f1;
    }

    .input-bar button {
      background: #6366f1;
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 0 1.25rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .input-bar button:hover {
      background: #4f46e5;
    }

    .input-bar button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho -->
    <header class="chat-header">
      <div class="header-main">
        <div class="bot-info">
          <div class="avatar">🤖</div>
          <div>
            <h2>EduBot - Assistente DevAcademy</h2>
            <p>Conectado via Webhook HTTP no n8n</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-secondary" id="btnToggleUrl" title="Editar URL do Webhook">⚙️ URL Webhook</button>
          <button class="btn-secondary" id="btnNewSession" title="Gerar nova sessão e limpar conversa">🔄 Nova Sessão</button>
        </div>
      </div>

      <!-- Configuração da URL do Webhook -->
      <div class="webhook-bar" id="webhookBar">
        <label for="webhookUrl">Webhook URL:</label>
        <input type="text" id="webhookUrl" value="https://n8n.incluc0de.com.br/webhook/chat" placeholder="https://n8n.incluc0de.com.br/webhook/chat">
        <div class="quick-urls">
          <button type="button" class="btn-chip" onclick="setWebhook('https://n8n.incluc0de.com.br/webhook/chat')">Cloud Prod</button>
          <button type="button" class="btn-chip" onclick="setWebhook('https://n8n.incluc0de.com.br/webhook-test/chat')">Cloud Test</button>
          <button type="button" class="btn-chip" onclick="setWebhook('http://localhost:5678/webhook/chat')">Local</button>
        </div>
      </div>
    </header>

    <!-- Área de Mensagens -->
    <main class="messages-area" id="messagesArea">
      <div class="message bot">
        <div class="bubble">Olá! 👋 Sou o <strong>EduBot</strong>, seu assistente da DevAcademy. Em que posso te ajudar hoje?</div>
        <span class="time">Agora</span>
      </div>
    </main>

    <!-- Indicador de Digitação -->
    <div class="typing" id="typingIndicator">
      <span></span><span></span><span></span>
      <p style="margin-left: 0.5rem;">EduBot está pensando e consultando a base de dados...</p>
    </div>

    <!-- Barra de Input -->
    <form class="input-bar" id="chatForm">
      <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." autocomplete="off" required>
      <button type="submit" id="btnSend">Enviar</button>
    </form>
  </div>

  <script>
    // Recupera ou gera Session ID
    let sessionId = localStorage.getItem('edubot_session_id') || 'sessao_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('edubot_session_id', sessionId);

    // Recupera URL do webhook salva ou usa padrão da sua instância
    const webhookInput = document.getElementById('webhookUrl');
    const savedUrl = localStorage.getItem('edubot_webhook_url');
    if (savedUrl) {
      webhookInput.value = savedUrl;
    } else {
      webhookInput.value = 'https://n8n.incluc0de.com.br/webhook/chat';
    }

    const messagesArea = document.getElementById('messagesArea');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const btnSend = document.getElementById('btnSend');
    const typingIndicator = document.getElementById('typingIndicator');
    const btnNewSession = document.getElementById('btnNewSession');
    const btnToggleUrl = document.getElementById('btnToggleUrl');
    const webhookBar = document.getElementById('webhookBar');

    window.setWebhook = function(url) {
      webhookInput.value = url;
      localStorage.setItem('edubot_webhook_url', url);
    };

    btnToggleUrl.addEventListener('click', () => {
      webhookBar.style.display = webhookBar.style.display === 'none' ? 'flex' : 'none';
    });

    btnNewSession.addEventListener('click', () => {
      sessionId = 'sessao_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('edubot_session_id', sessionId);
      messagesArea.innerHTML = `
        <div class="message bot">
          <div class="bubble">🔄 Sessão reiniciada! Nova chave: <code>${sessionId}</code>.<br>Como posso ajudar você agora?</div>
          <span class="time">${getTime()}</span>
        </div>
      `;
    });

    webhookInput.addEventListener('change', () => {
      localStorage.setItem('edubot_webhook_url', webhookInput.value.trim());
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      const url = webhookInput.value.trim();
      if (!text || !url) return;

      // Adiciona mensagem do usuário
      appendMessage('user', text);
      userInput.value = '';
      setLoading(true);

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            message: text,
            session_id: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`Status ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        // Trata respostas retornadas pelo n8n
        let botReply = '';
        if (typeof data === 'string') {
          botReply = data;
        } else if (data.output) {
          botReply = data.output;
        } else if (Array.isArray(data) && data[0]?.output) {
          botReply = data[0].output;
        } else if (data.message) {
          botReply = data.message;
        } else {
          botReply = JSON.stringify(data, null, 2);
        }

        appendMessage('bot', botReply);

      } catch (err) {
        appendMessage('bot', `❌ **Erro ao conectar ao Webhook:**\n${err.message}\n\n*Dica: Verifique se o n8n está ativo e se a URL configurada é a mesma do seu nó Webhook.*`);
      } finally {
        setLoading(false);
        userInput.focus();
      }
    });

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = `
        <div class="bubble">${text}</div>
        <span class="time">${getTime()}</span>
      `;
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function setLoading(isLoading) {
      userInput.disabled = isLoading;
      btnSend.disabled = isLoading;
      typingIndicator.style.display = isLoading ? 'flex' : 'none';
      if (isLoading) messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function getTime() {
      const d = new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
