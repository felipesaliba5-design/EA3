  </defs>

  <!-- Topo do Corpo -->
  <rect x="28" y="54" width="64" height="38" rx="6" fill="url(#avYellow)" stroke="#a16207" stroke-width="1.5" />
  <rect x="34" y="58" width="52" height="16" rx="2" fill="#1e293b" />
  <rect x="38" y="63" width="10" height="2.5" rx="1" fill="#22c55e" />
  <rect x="38" y="67" width="14" height="2.5" rx="1" fill="#22c55e" />
  <circle cx="56" cy="66" r="3" fill="#ef4444" />

