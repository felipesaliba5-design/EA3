<svg viewBox="18 8 84 84" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Avatar EduBot">
  <defs>
    <linearGradient id="avYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="avSilver" x1="0%" y1="0%" x2="100%" y2="0%">
